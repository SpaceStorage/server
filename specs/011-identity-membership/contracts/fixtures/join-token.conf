# Unattended join: one-time token skips a second admit.
cluster {
    join;
    token_file /etc/spacestorage/join.secret;
    join_token_file /etc/spacestorage/db-3.join.token;
    join_token_ttl 12h;
    seeds {
        name db-1;
        address 127.0.0.1;
        port 7702;
    }
}
node {
    name db-3;
    labels {
        az az2;
    }
}
