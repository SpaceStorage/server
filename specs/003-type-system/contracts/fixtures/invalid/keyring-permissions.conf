# expect: keyring_permissions
# The harness writes the referenced keyring with mode 0644 before validating.
node { name db-1; }
admin { token_file /etc/spacestorage/admin.token; }
disable admin-http;
entrypoint admin { port 7700; handler admin; }
storage { data_dir /var/lib/spacestorage; }
keys { keyring_file ./keyring-0644; }
