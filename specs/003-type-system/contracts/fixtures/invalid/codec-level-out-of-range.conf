# expect: types_codec_level_out_of_range{c=zstd, range=1..=11}
node { name db-1; }
admin { token_file /etc/spacestorage/admin.token; }
disable admin-http;
entrypoint admin { port 7700; handler admin; }
storage { data_dir /var/lib/spacestorage; }
types { default_compression zstd; default_compression_level 22; }
