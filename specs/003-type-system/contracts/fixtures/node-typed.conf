# Starter node with the type system enabled (feature 003).
# Must pass `spacestorage validate` unchanged.

node {
  name db-1;
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/admin.token;
}

auth {
  users_file /etc/spacestorage/users;        # feature 002
}

query_defaults {                              # feature 002
  write_quorum TWO;
  read_quorum  ONE;
  timeout      30s;
  max_timeout  10m;
}

storage {
  data_dir                /var/lib/spacestorage;
  sync                    fdatasync;
  wal_segment_size        64m;
  compaction_concurrency  4;
}

memory {
  size 8g;
  labels {
    tier ram;
  }
}

types {
  block_size                   64k;
  default_compression          zstd;
  default_compression_level    3;
  dictionary_max_cardinality   65536;
  default_encryption_scope     drives;
  max_composition_depth        8;
}

keys {
  keyring_file /etc/spacestorage/keyring;     # interim KeyAuthority until feature 07
}

entrypoint admin {
  address 127.0.0.1;
  port 7700;
  handler admin;
}

entrypoint admin-http {
  address 127.0.0.1;
  port 7701;
  handler admin-http;
}

entrypoint {
  port 5432;
  handler postgresql;                         # feature 002
}

buffers {
  net.recv           128m;
  net.send           128m;
  request.queue       32m;

  types.memory         8g;
  storage.memtable   256m;
  storage.block_cache 512m;
  storage.wal         64m;
  catalog.metadata    32m;

  exec.records         8m;
}
