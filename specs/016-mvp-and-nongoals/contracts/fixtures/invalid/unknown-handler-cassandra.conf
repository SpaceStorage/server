# Invalid: complete-product handler named in a first-binary build (SC-002 / G8).

node {
  name db-1;
  labels {
    az local;
  }
}

admin {
  token_file /etc/spacestorage/admin.token;
}

cluster {
  name demo;
  bootstrap;
  topology_ladder az;
  quorum_domain lab;
  master_key_file /etc/spacestorage/master.key;
  token_file /etc/spacestorage/join.secret;
}

entrypoint admin-http {
  address 127.0.0.1;
  port 7701;
  handler admin-http;
  plaintext;
}

disable admin;

entrypoint internode {
  address 127.0.0.1;
  port 7702;
  handler internode;
  plaintext;
}

entrypoint replication {
  address 127.0.0.1;
  port 7703;
  handler replication;
  plaintext;
}

entrypoint {
  port 9042;
  handler cassandra;
  plaintext;
}
