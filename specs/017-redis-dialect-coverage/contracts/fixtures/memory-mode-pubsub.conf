# Config fixture for the memory-mode / pub-sub scenario (017).
#
# Pub/sub channels are process memory only and are never replayed across a
# restart; a memory-mode container does not promise content across a restart
# either (spec FR-016 / Assumptions). The container's storage tier
# (memory / hybrid / persistent) is a property of the `003` type descriptors,
# not a config directive, so this fixture is a plain Redis node.
#
# `max_block` is deliberately left unset: it must resolve to `None`, i.e. the
# stock indefinite timeout 0, which proves the default path.
#
# Must pass `spacestorage validate` offline.

disable admin;
disable admin-http;

cluster {
    starter_namespace acme;
}

node {
    name db-1;
}

entrypoint rd {
    handler redis;
    port 6379;
    plaintext;
}
