# Config fixture for the complete-product Redis dialect (017).
#
# The dialect profile derives from the build release (`client_dialect()`),
# there is no config directive that selects it. This fixture exercises the
# `protocols { redis { max_block } }` knob: a positive value caps every
# blocking command (BLPOP/BRPOP/BZPOPMIN/BZPOPMAX/XREAD BLOCK).
#
# Must pass `spacestorage validate` offline.

disable admin;
disable admin-http;

cluster {
    starter_namespace acme;
}

node {
    name db-1;
    labels {
        az az1;
    }
}

entrypoint rd {
    handler redis;
    port 6379;
    plaintext;
}

protocols {
    redis {
        # Cap all blocking waits at 5 minutes; `0` would be capped too.
        max_block 300;
    }
}
