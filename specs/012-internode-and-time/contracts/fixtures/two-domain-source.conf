# source domain named eu (first create the domain object, then join)
node { name eu-1; labels { az a; } }
cluster {
  join;
  quorum_domain eu;
  token_file "join.secret";
  seeds { name db-1; address 10.0.0.1; port 7000; }
}
entrypoint { address 10.0.0.11; port 7000; handler internode; plaintext; }
entrypoint { address 10.0.0.11; port 7001; handler replication; plaintext; }
entrypoint { address 127.0.0.1; port 7701; handler admin; plaintext; }
entrypoint { address 127.0.0.1; port 7702; handler admin-http; plaintext; }
disable postgresql;
disable redis;
