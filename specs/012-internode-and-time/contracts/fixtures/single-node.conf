# single-node first-binary starter (SC-001)
node { name db-1; }
cluster {
  bootstrap;
  token_file "join.secret";
  heartbeat_interval 2s;
  failure_timeout 15s;
}
entrypoint { address 127.0.0.1; port 7601; handler admin; plaintext; }
entrypoint { address 127.0.0.1; port 7602; handler admin-http; plaintext; }
entrypoint { address 127.0.0.1; port 7000; handler internode; plaintext; }
entrypoint { address 127.0.0.1; port 7001; handler replication; plaintext; }
disable postgresql;
disable redis;
