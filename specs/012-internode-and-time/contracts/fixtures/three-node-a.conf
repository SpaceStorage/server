# three-node member in default domain (join; bind a cluster address)
node { name db-2; labels { az a; } }
cluster {
  join;
  quorum_domain default;
  token_file "join.secret";
  seeds { name db-1; address 10.0.0.1; port 7000; }
  heartbeat_interval 2s;
  failure_timeout 15s;
}
entrypoint { address 127.0.0.1; port 7611; handler admin; plaintext; }
entrypoint { address 127.0.0.1; port 7612; handler admin-http; plaintext; }
entrypoint { address 10.0.0.2; port 7000; handler internode; plaintext; }
entrypoint { address 10.0.0.2; port 7001; handler replication; plaintext; }
disable postgresql;
disable redis;
