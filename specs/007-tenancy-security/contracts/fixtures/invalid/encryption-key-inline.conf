# Encryption key material must never be inlined in config or declarations.
cluster {
    starter_namespace acme;
}

# Invalid: a container encryption stanza with raw key bytes (shape is illustrative).
# validate MUST fail with KeyMaterialForbidden regardless of surrounding type syntax.
container orders {
    encryption {
        algorithm AES-256-GCM;
        key "0123456789abcdef0123456789abcdef";
        scope drives;
    }
}
