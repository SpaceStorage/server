# Starter: one rack, three nodes described by repeating this file with name/az/port changes.
# Full mesh lives in cluster-3az/. This file is the documented single-rack shape (FR-075).

node {
  name db-rack-1;
  labels {
    rack rack1;
    az az1;
    region eu;
  }
}

runtime { threads auto; drain_timeout 30s; }
log { level info; format text; }
admin { token_file /etc/spacestorage/admin.token; }
auth { users_file /etc/spacestorage/users; }
query_defaults { write_quorum TWO; read_quorum ONE; timeout 30s; max_timeout 10m; }

cluster {
  locality_key region;
  token_file /etc/spacestorage/cluster.token;
  heartbeat_interval 2s;
  failure_timeout 15s;
  peers {
    name db-rack-2;
    address 127.0.0.1;
    port 7712;
  }
}

storage {
  data_dir /var/lib/spacestorage;
  drive data { path /var/lib/spacestorage/data; media ssd; }
}

memory { size 8g; labels { tier ram; } }

replication {
  hinted_handoff_window 3h;
  repair_interval 24h;
}

entrypoint admin { address 127.0.0.1; port 7700; handler admin; }
entrypoint internodes { address 127.0.0.1; port 7702; handler internode; }
entrypoint { port 5432; handler postgresql; }

buffers {
  internode.recv 64m;
  internode.send 64m;
  placement.hints 256m;
  placement.repair 64m;
  types.memory 8g;
}
