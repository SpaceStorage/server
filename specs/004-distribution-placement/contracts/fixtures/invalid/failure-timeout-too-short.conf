node { name db-1; }
runtime { threads auto; }
admin { token_file /etc/spacestorage/admin.token; }
cluster {
  token_file /etc/spacestorage/cluster.token;
  heartbeat_interval 10s;
  failure_timeout 1s;
}
entrypoint internodes { address 127.0.0.1; port 7702; handler internode; }
storage { data_dir /var/lib/spacestorage; }
entrypoint admin { address 127.0.0.1; port 7700; handler admin; }
