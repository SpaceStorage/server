# Starter: single node (FR-075). Must pass `spacestorage validate` unchanged.
# Internodes disabled: replication factor > 1 is refused at declare.

node {
  name db-1;
  labels {
    rack r1;
    az az1;
    region eu;
  }
}

runtime { threads auto; drain_timeout 30s; }
log { level info; format text; }

admin { token_file /etc/spacestorage/admin.token; }
disable internode;

auth { users_file /etc/spacestorage/users; }

query_defaults {
  write_quorum TWO;
  read_quorum  ONE;
  timeout      30s;
  max_timeout  10m;
}

storage {
  data_dir /var/lib/spacestorage;
  sync fdatasync;
  drive data {
    path /var/lib/spacestorage/data;
    media ssd;
  }
}

memory {
  size 8g;
  labels { tier ram; }
}

entrypoint admin { address 127.0.0.1; port 7700; handler admin; }
entrypoint admin-http { address 127.0.0.1; port 7701; handler admin-http; }
entrypoint { port 5432; handler postgresql; }

buffers {
  net.recv 128m;
  net.send 128m;
  types.memory 8g;
  storage.memtable 256m;
  storage.block_cache 512m;
}
