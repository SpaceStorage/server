node {
  name us-1;
  labels { rack r9; az az9; region us; continent america; }
}
runtime { threads auto; drain_timeout 30s; }
log { level info; format text; }
admin { token_file /etc/spacestorage/admin.token; }
auth { users_file /etc/spacestorage/users; }
query_defaults { write_quorum TWO; read_quorum ONE; timeout 30s; max_timeout 10m; }
cluster {
  locality_key region;
  token_file /etc/spacestorage/cluster.token;
  peers { name eu-1; address 127.0.0.1; port 7702; }
  peers { name eu-2; address 127.0.0.1; port 7712; }
}
storage {
  data_dir /var/lib/spacestorage/us-1;
  drive data { path /var/lib/spacestorage/us-1/data; media ssd; }
}
memory { size 8g; labels { tier ram; } }
replication { hinted_handoff_window 3h; async_lag_threshold 60s; }
entrypoint admin { address 127.0.0.1; port 7720; handler admin; }
entrypoint internodes { address 127.0.0.1; port 7722; handler internode; }
entrypoint { port 5434; handler postgresql; }
buffers { internode.recv 64m; internode.send 64m; types.memory 8g; }
