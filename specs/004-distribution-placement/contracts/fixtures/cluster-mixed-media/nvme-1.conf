node {
  name nvme-1;
  labels { rack r1; az az1; region eu; }
}
runtime { threads auto; drain_timeout 30s; }
log { level info; format text; }
admin { token_file /etc/spacestorage/admin.token; }
auth { users_file /etc/spacestorage/users; }
query_defaults { write_quorum TWO; read_quorum ONE; timeout 30s; max_timeout 10m; }
cluster {
  locality_key region;
  token_file /etc/spacestorage/cluster.token;
  peers { name hdd-1; address 127.0.0.1; port 7712; }
}
storage {
  data_dir /var/lib/spacestorage/nvme-1;
  drive fast { path /var/lib/spacestorage/nvme-1/nvme; media nvme; }
}
memory { size 8g; labels { tier ram; } }
entrypoint admin { address 127.0.0.1; port 7700; handler admin; }
entrypoint internodes { address 127.0.0.1; port 7702; handler internode; }
entrypoint { port 5432; handler postgresql; }
buffers { internode.recv 64m; internode.send 64m; types.memory 8g; }
