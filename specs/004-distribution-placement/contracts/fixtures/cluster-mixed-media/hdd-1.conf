node {
  name hdd-1;
  labels { rack r2; az az2; region eu; }
}
runtime { threads auto; drain_timeout 30s; }
log { level info; format text; }
admin { token_file /etc/spacestorage/admin.token; }
auth { users_file /etc/spacestorage/users; }
query_defaults { write_quorum TWO; read_quorum ONE; timeout 30s; max_timeout 10m; }
cluster {
  locality_key region;
  token_file /etc/spacestorage/cluster.token;
  peers { name nvme-1; address 127.0.0.1; port 7702; }
}
storage {
  data_dir /var/lib/spacestorage/hdd-1;
  drive slow { path /var/lib/spacestorage/hdd-1/hdd; media hdd; }
}
# No memory pool: excluded from memory-mode placement.
entrypoint admin { address 127.0.0.1; port 7710; handler admin; }
entrypoint internodes { address 127.0.0.1; port 7712; handler internode; }
entrypoint { port 5433; handler postgresql; }
buffers { internode.recv 64m; internode.send 64m; types.memory 8g; }
