# SpaceStorage starter node configuration (SC-011).
# Every listening port is an entrypoint with exactly one handler.
# Both admin handlers must be explicitly enabled (an entrypoint) or disabled ('disable <handler>;').

node {
  name db-1;
}

runtime {
  threads auto;            # one worker thread per available core (restart-required)
  drain_timeout 30s;       # live-reloadable
}

log {
  level info;              # live-reloadable
  format text;             # restart-required
}

admin {
  token_file /etc/spacestorage/admin.token;   # referenced, never inlined
}

entrypoint admin {
  address 127.0.0.1;
  port 7700;
  handler admin;
}

entrypoint admin-http {
  address 0.0.0.0;
  port 7701;
  handler admin-http;
  tls {
    certificate /etc/spacestorage/tls/admin.crt;
    key         /etc/spacestorage/tls/admin.key;
  }
}

entrypoint {
  port 9042;               # address defaults to 127.0.0.1
  handler cassandra;       # registered by feature 02
}

buffers {                  # live-reloadable
  net.recv      128m;
  net.send      128m;
  request.queue  32m;
}
