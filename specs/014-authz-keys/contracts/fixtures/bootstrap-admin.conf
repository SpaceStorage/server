# First node: bootstrap CLUSTER_ADMIN + join secret (011) + starter ns (007).
cluster {
    bootstrap;
    token_file /etc/spacestorage/join.secret;
    admin_login admin;
    admin_password_file /etc/spacestorage/admin.password;
    starter_namespace acme;
}
keys {
    master_key_file /etc/spacestorage/master.key;
    create_master_if_absent;
}
node {
    name db-1;
    labels {
        az az1;
    }
}
