# Starter metrics block for contract tests (complete-product profile).
# First binary: omit otel/kafka/syslog/slow_query enabled; GET /metrics still works.

node { name n1; }

runtime { threads 2; }

log {
  level info;
  format json;
}

admin { token_file /dev/null; }

entrypoint admin_http {
  port 8080;
  handler admin-http;
  plaintext;
}

entrypoint admin_tcp {
  port 8081;
  handler admin;
  plaintext;
}

metrics {
  slow_query {
    enabled off;
    threshold 1s;
  }
  audit_log off;
}
