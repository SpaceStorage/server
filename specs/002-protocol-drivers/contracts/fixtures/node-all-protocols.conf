# Starter node configuration with every protocol handler (SC-010).
# Must pass `spacestorage validate` unchanged.

node {
  name db-1;
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/admin.token;
}

auth {
  users_file /etc/spacestorage/users;        # interim credential store until feature 07
}

query_defaults {
  write_quorum TWO;
  read_quorum  ONE;
  timeout      30s;
  max_timeout  10m;
}

entrypoint admin       { address 127.0.0.1; port 7700; handler admin; }
entrypoint admin-http  { address 127.0.0.1; port 7701; handler admin-http; }

entrypoint postgresql      { port 5432; handler postgresql; }
entrypoint cassandra       { port 9042; handler cassandra; }
entrypoint redis           { port 6379; handler redis; }
entrypoint elasticsearch   { port 9200; handler elasticsearch; }
entrypoint clickhouse      { port 9000; handler clickhouse; }
entrypoint clickhouse-http { port 8123; handler clickhouse-http; }
entrypoint s3              { port 9010; handler s3; }
entrypoint webdav          { port 9020; handler webdav; }

protocols {
  postgresql    { server_version "16.4 (SpaceStorage)"; }
  cassandra     { cluster_name spacestorage; protocol_versions 4 5; }
  redis         { default_container redis; }
  elasticsearch { version "8.15.0"; }
  s3            { max_object_size 5g; }
  webdav        { realm "SpaceStorage"; }
}

buffers {
  net.recv      128m;
  net.send      128m;
  request.queue  32m;
  types.memory    2g;
}
