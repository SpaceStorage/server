# expect: entrypoint_duplicate_address
admin { token_file /etc/spacestorage/admin.token; }
auth { users_file /etc/spacestorage/users; }
disable admin;
entrypoint admin-http { port 7701; handler admin-http; }
entrypoint pg    { port 5432; handler postgresql; }
entrypoint redis { port 5432; handler redis; }
