[package]
name = "spacestorage-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Slice 7: allow `controller_exclusive_data on` at validate.
controlplane-ops = []
# Slice 10: default `jobs.enabled on` when block present.
migration-backup = []
# Slice 11: allow UI/ingest config (otherwise first-binary rejects).
complete-product = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
spacestorage-crypto = { path = "../crypto" }
spacestorage-compat = { path = "../compat" }

[dev-dependencies]
tempfile = { workspace = true }
