[package]
name = "spacestorage-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared query planner/executor (005)"
publish = false

[features]
default = []
# Slice 8: join / aggregate / MapReduce / shuffle / subscribe / BEGIN+COPY execution.
query-distributed = []
tenancy-quotas = ["spacestorage-tenancy/tenancy-quotas"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
spacestorage-types = { path = "../types" }
spacestorage-compat = { path = "../compat" }
spacestorage-placement = { path = "../placement" }
spacestorage-tenancy = { path = "../tenancy" }
spacestorage-authz = { path = "../authz" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
spacestorage-authz = { path = "../authz" }
