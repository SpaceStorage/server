[package]
name = "spacestorage-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
spacestorage-config = { path = "../config" }
spacestorage-admin-proto = { path = "../admin-proto" }
spacestorage-release-profile = { path = "../release-profile" }
spacestorage-storage = { path = "../storage" }
spacestorage-crypto = { path = "../crypto" }
spacestorage-types = { path = "../types" }
spacestorage-authz = { path = "../authz" }
spacestorage-handler-postgresql = { path = "../handler-postgresql" }
spacestorage-handler-redis = { path = "../handler-redis" }
tokio = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
