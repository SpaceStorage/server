[package]
name = "spacestorage-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
tenancy-quotas = [
    "spacestorage-tenancy/tenancy-quotas",
    "spacestorage-config/tenancy-quotas",
    "spacestorage-query/tenancy-quotas",
]
[dependencies]
spacestorage-config = { path = "../config", features = ["complete-product", "migration-backup"] }
spacestorage-compat = { path = "../compat" }
spacestorage-admin-proto = { path = "../admin-proto" }
spacestorage-release-profile = { path = "../release-profile", features = ["complete-product"] }
spacestorage-storage = { path = "../storage" }
spacestorage-crypto = { path = "../crypto" }
spacestorage-types = { path = "../types" }
spacestorage-authz = { path = "../authz" }
spacestorage-membership = { path = "../membership" }
spacestorage-internode = { path = "../internode" }
spacestorage-replication = { path = "../replication" }
spacestorage-handler-postgresql = { path = "../handler-postgresql", features = ["query-distributed"] }
spacestorage-handler-redis = { path = "../handler-redis" }
spacestorage-handler-cassandra = { path = "../handler-cassandra" }
spacestorage-handler-elasticsearch = { path = "../handler-elasticsearch", features = ["query-distributed"] }
spacestorage-handler-clickhouse = { path = "../handler-clickhouse", features = ["query-distributed"] }
spacestorage-handler-s3 = { path = "../handler-s3" }
spacestorage-handler-webdav = { path = "../handler-webdav" }
spacestorage-observability = { path = "../observability" }
spacestorage-migrate = { path = "../migrate", features = ["migrate"] }
spacestorage-backup = { path = "../backup" }
spacestorage-admin-ui = { path = "../admin-ui", features = ["ui"] }
spacestorage-ingest = { path = "../ingest", features = ["ingest"] }
spacestorage-query = { path = "../query", features = ["query-distributed"] }
spacestorage-controlplane = { path = "../controlplane" }
spacestorage-placement = { path = "../placement" }
spacestorage-tenancy = { path = "../tenancy" }
tokio = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
parking_lot = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
