[package]
name = "spacestorage-handler-postgresql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PostgreSQL protocol handler (002 first-binary)"
publish = false

[features]
default = []
query-distributed = ["spacestorage-query/query-distributed"]

[dependencies]
spacestorage-compat = { path = "../compat" }
spacestorage-types = { path = "../types" }
spacestorage-protocol-core = { path = "../protocol-core" }
spacestorage-query = { path = "../query" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
