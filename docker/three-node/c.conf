# Docker three-node cluster — member C (join via one-time token).

node {
  name db-c;
  labels {
    az c;
  }
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/secrets/admin.token;
}

cluster {
  name demo;
  join;
  topology_ladder az;
  quorum_domain lab;
  master_key_file /etc/spacestorage/secrets/master.key;
  token_file /etc/spacestorage/secrets/join.secret;
  join_token_file /etc/spacestorage/secrets/db-c.join.token;
  seeds {
    name db-a;
    address db-a;
    port 7702;
  }
}

query_defaults {
  write_quorum TWO;
  read_quorum ONE;
}

entrypoint admin {
  address db-c;
  port 7700;
  handler admin;
  plaintext;
}

entrypoint admin-http {
  address db-c;
  port 7701;
  handler admin-http;
  plaintext;
}

entrypoint postgresql {
  address db-c;
  port 5432;
  handler postgresql;
  plaintext;
}

entrypoint redis {
  address db-c;
  port 6379;
  handler redis;
  plaintext;
}

entrypoint internode {
  address db-c;
  port 7702;
  handler internode;
  plaintext;
}

entrypoint replication {
  address db-c;
  port 7703;
  handler replication;
  plaintext;
}

storage {
  data_dir /var/lib/spacestorage;
  drive nvme0 {
    path /var/lib/spacestorage/nvme0;
    media nvme;
  }
}
