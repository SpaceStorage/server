# Docker three-node cluster — member A (bootstrap).
# Binds to the Compose service DNS name so peers can dial back.

node {
  name db-a;
  labels {
    az a;
  }
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/secrets/admin.token;
}

cluster {
  name demo;
  bootstrap;
  topology_ladder az;
  quorum_domain lab;
  master_key_file /etc/spacestorage/secrets/master.key;
  token_file /etc/spacestorage/secrets/join.secret;
}

query_defaults {
  write_quorum TWO;
  read_quorum ONE;
}

entrypoint admin {
  address db-a;
  port 7700;
  handler admin;
  plaintext;
}

entrypoint admin-http {
  address db-a;
  port 7701;
  handler admin-http;
  plaintext;
}

entrypoint postgresql {
  address db-a;
  port 5432;
  handler postgresql;
  plaintext;
}

entrypoint redis {
  address db-a;
  port 6379;
  handler redis;
  plaintext;
}

entrypoint internode {
  address db-a;
  port 7702;
  handler internode;
  plaintext;
}

entrypoint replication {
  address db-a;
  port 7703;
  handler replication;
  plaintext;
}

storage {
  data_dir /var/lib/spacestorage;
  drive nvme0 {
    path /var/lib/spacestorage/nvme0;
    media nvme;
  }
}
