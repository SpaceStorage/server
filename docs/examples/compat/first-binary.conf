# First-binary dialect: PG + Redis, same product version, default limits (built-in if omitted).
cluster {
    bootstrap;
    token_file /etc/spacestorage/join.secret;
    admin_login admin;
    admin_password_file /etc/spacestorage/admin.password;
    starter_namespace acme;
    product_version 1;
}
node {
    name db-1;
    labels {
        az az1;
    }
}
entrypoint pg {
    handler postgresql;
    listen 127.0.0.1:5432;
    plaintext;
}
entrypoint rd {
    handler redis;
    listen 127.0.0.1:6379;
    plaintext;
}
query {
    spill off;
}
