# two drives on one node (SC-003)
node { name db-1; }
storage {
  data_dir "./data";
  sync fdatasync;
  gc_grace 24h;
  drive nvme0 { path "./data/nvme0"; media nvme; }
  drive hdd0  { path "./data/hdd0";  media hdd; }
}
entrypoint { address 127.0.0.1; port 7601; handler admin; plaintext; }
entrypoint { address 127.0.0.1; port 7602; handler admin-http; plaintext; }
disable postgresql;
disable redis;
