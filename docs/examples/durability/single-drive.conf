# single-drive first-binary WAL (SC-001, SC-002)
node { name db-1; }
storage {
  data_dir "./data";
  sync fdatasync;
  gc_grace 24h;
}
entrypoint { address 127.0.0.1; port 7601; handler admin; plaintext; }
entrypoint { address 127.0.0.1; port 7602; handler admin-http; plaintext; }
disable postgresql;
disable redis;
