# First-binary three-node cluster — member B (join).

node {
  name db-b;
  labels {
    az b;
  }
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/admin.token;
}

cluster {
  name demo;
  join;
  topology_ladder az;
  quorum_domain lab;
  master_key_file /etc/spacestorage/master.key;
  token_file /etc/spacestorage/join.secret;
  seeds {
    address 127.0.0.1;
    port 7702;
  }
}

query_defaults {
  write_quorum TWO;
  read_quorum ONE;
}

entrypoint admin {
  address 127.0.0.1;
  port 7800;
  handler admin;
  plaintext;
}

entrypoint admin-http {
  address 127.0.0.1;
  port 7801;
  handler admin-http;
  plaintext;
}

entrypoint postgresql {
  address 127.0.0.1;
  port 5433;
  handler postgresql;
  plaintext;
}

entrypoint redis {
  address 127.0.0.1;
  port 6380;
  handler redis;
  plaintext;
}

entrypoint internode {
  address 127.0.0.1;
  port 7802;
  handler internode;
  plaintext;
}

entrypoint replication {
  address 127.0.0.1;
  port 7803;
  handler replication;
  plaintext;
}

storage {
  data_dir /var/lib/spacestorage/db-b;
  drive nvme0 {
    path /var/lib/spacestorage/db-b/nvme0;
    media nvme;
  }
}
