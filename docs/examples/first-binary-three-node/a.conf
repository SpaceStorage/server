# First-binary three-node cluster — member A (bootstrap).
# Distinct az values so RF=3 default anti-affinity is satisfiable.
# Join remotes: internode/replication bind 127.0.0.1; same-host demo uses distinct ports.
# write_quorum TWO is the product default (FR-009); do not copy ONE from the one-node starter.

node {
  name db-a;
  labels {
    az a;
  }
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/admin.token;
}

cluster {
  name demo;
  bootstrap;
  topology_ladder az;
  quorum_domain lab;
  master_key_file /etc/spacestorage/master.key;
  token_file /etc/spacestorage/join.secret;
}

query_defaults {
  write_quorum TWO;
  read_quorum ONE;
}

entrypoint admin {
  address 127.0.0.1;
  port 7700;
  handler admin;
  plaintext;
}

entrypoint admin-http {
  address 127.0.0.1;
  port 7701;
  handler admin-http;
  plaintext;
}

entrypoint postgresql {
  address 127.0.0.1;
  port 5432;
  handler postgresql;
  plaintext;
}

entrypoint redis {
  address 127.0.0.1;
  port 6379;
  handler redis;
  plaintext;
}

entrypoint internode {
  address 127.0.0.1;
  port 7702;
  handler internode;
  plaintext;
}

entrypoint replication {
  address 127.0.0.1;
  port 7703;
  handler replication;
  plaintext;
}

storage {
  data_dir /var/lib/spacestorage/db-a;
  drive nvme0 {
    path /var/lib/spacestorage/db-a/nvme0;
    media nvme;
  }
}
