# Slice-11 starter: syslog listen 1:1 to namespace acme container events.
# CLUSTER_ADMIN only. Restart-required (entrypoint).

node { name n1; }

runtime { threads 2; }

log {
  level info;
  format text;
}

admin { token_file /dev/null; }

entrypoint admin_http {
  port 8080;
  handler admin-http;
  plaintext;
}

entrypoint admin_tcp {
  port 8081;
  handler admin;
  plaintext;
}

entrypoint syslog-acme {
  address 0.0.0.0;
  port 5514;
  handler syslog;
  plaintext;
  ingest {
    namespace acme;
    container events;
    type log_stream;
  }
}

buffers {
  ingest.syslog.recv 16m;
}
