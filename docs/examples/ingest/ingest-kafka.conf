# Slice-11 starter: Kafka ingest bootstrap (cluster store empty).
# Tenant NAMESPACE_ADMIN+WRITE may also create the same object via admin API.

node { name n1; }

runtime { threads 2; }

log {
  level info;
  format text;
}

admin { token_file /dev/null; }

entrypoint admin_http {
  port 8080;
  handler admin-http;
  plaintext;
}

entrypoint admin_tcp {
  port 8081;
  handler admin;
  plaintext;
}

ingest kafka acme-events {
  namespace acme;
  container events;
  type log_stream;
  format raw;
  brokers "127.0.0.1:9092";
  topic logs;
  group spacestorage-acme-events;
  plaintext;
}

buffers {
  ingest.kafka.decode 32m;
}
