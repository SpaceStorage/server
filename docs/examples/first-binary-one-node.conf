# SpaceStorage first-binary starter — single node (SC-001).
# Ladder [az]; one value is enough. Cluster ports listen on loopback.
# Transport is explicit on every entrypoint (014). Handlers: PG + Redis only (016).
# write_quorum ONE is a lab override (FR-009); product default remains TWO.

node {
  name db-1;
  labels {
    az local;
  }
}

runtime {
  threads auto;
  drain_timeout 30s;
}

log {
  level info;
  format text;
}

admin {
  token_file /etc/spacestorage/admin.token;
}

cluster {
  name demo;
  bootstrap;
  topology_ladder az;
  quorum_domain lab;
  master_key_file /etc/spacestorage/master.key;
  token_file /etc/spacestorage/join.secret;
}

query_defaults {
  write_quorum ONE;
  read_quorum ONE;
}

entrypoint admin {
  address 127.0.0.1;
  port 7700;
  handler admin;
  plaintext;
}

entrypoint admin-http {
  address 127.0.0.1;
  port 7701;
  handler admin-http;
  plaintext;
}

entrypoint postgresql {
  address 127.0.0.1;
  port 5432;
  handler postgresql;
  plaintext;
}

entrypoint redis {
  address 127.0.0.1;
  port 6379;
  handler redis;
  plaintext;
}

entrypoint internode {
  address 127.0.0.1;
  port 7702;
  handler internode;
  plaintext;
}

entrypoint replication {
  address 127.0.0.1;
  port 7703;
  handler replication;
  plaintext;
}

storage {
  data_dir /var/lib/spacestorage/db-1;
  drive nvme0 {
    path /var/lib/spacestorage/db-1/nvme0;
    media nvme;
  }
}

buffers {
  net.recv 128m;
  net.send 128m;
  request.queue 32m;
}
